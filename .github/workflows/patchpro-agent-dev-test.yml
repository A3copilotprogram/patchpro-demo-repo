permissions:
  contents: read
  pull-requests: write

name: PatchPro Agent-Dev (Phase 1 Evaluation Test)
on:
  pull_request:
    branches:
      - demo/patchpro-ci-test  # Trigger for PRs targeting this branch
  workflow_dispatch:

concurrency:
  group: patchpro-agent-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patchpro-with-telemetry:
    timeout-minutes: 30  # Increased timeout for complex operations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout demo repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # Need full history for git diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install basic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.5.7 flask requests

      - name: Try PatchPro Bot installation (with fallback)
        run: |
          echo "🤖 Attempting PatchPro Bot installation..."
          
          # Try installing from main branch first
          if pip install git+https://github.com/A3copilotprogram/patchpro-bot.git@main; then
            echo "✅ PatchPro Bot installed successfully"
            echo "PATCHPRO_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "⚠️ PatchPro Bot installation failed, using mock mode"
            echo "PATCHPRO_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Run Analysis (PatchPro or Fallback)
        run: |
          mkdir -p .patchpro
          
          if [ "$PATCHPRO_AVAILABLE" = "true" ]; then
            echo "🤖 Running with PatchPro Bot..."
            
            # Create .patchpro.toml with agentic mode enabled
            cat > .patchpro.toml << 'EOF'
          [agent]
          enable_agentic_mode = true
          agentic_max_retries = 2
          agentic_enable_planning = true
          
          [llm]
          model = "gpt-4o-mini"
          temperature = 0.1
          max_tokens = 4096
          EOF
            
            # Try to run PatchPro analyze-pr
            timeout 20m python -m patchpro_bot.cli analyze-pr \
              --base origin/${{ github.base_ref }} \
              --head HEAD \
              --with-llm \
              --artifacts .patchpro \
              --no-exit-code || echo "⚠️ PatchPro analysis timed out or failed"
              
          else
            echo "🔄 Running fallback analysis..."
            # Create a basic report
            echo "# 🤖 PatchPro Analysis Report" > .patchpro/report.md
            echo "" >> .patchpro/report.md
            echo "⚠️ **Note**: PatchPro Bot installation failed, running in demo mode." >> .patchpro/report.md
            echo "" >> .patchpro/report.md
            echo "## 🔍 Basic Analysis" >> .patchpro/report.md
            echo "Repository analysis completed using basic tools." >> .patchpro/report.md
            echo "" >> .patchpro/report.md
            echo "### 📊 Files Checked" >> .patchpro/report.md
            find . -name "*.py" -not -path "./.git/*" | head -10 >> .patchpro/report.md
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PP_ARTIFACTS: .patchpro

      - name: Upload PatchPro artifacts (including telemetry)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patchpro-telemetry-artifacts
          path: |
            .patchpro/
            !.patchpro/.git
          if-no-files-found: warn  # Don't fail if no files found
          retention-days: 30

      - name: Post PR comment with results
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && hashFiles('.patchpro/report.md') != ''
        with:
          recreate: true
          path: .patchpro/report.md

      - name: Display telemetry summary
        if: always()
        run: |
          echo "## 📊 Telemetry Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f .patchpro/traces/traces.db ]; then
            echo "✅ Telemetry database created" >> $GITHUB_STEP_SUMMARY
            echo "- Database size: $(du -h .patchpro/traces/traces.db | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- Trace files: $(find .patchpro/traces -name '*.json' | wc -l)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No telemetry data captured" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d .patchpro ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find .patchpro -type f -name '*.diff' -o -name '*.json' -o -name '*.db' | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
