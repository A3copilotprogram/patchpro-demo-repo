permissions:
  contents: write
  pull-requests: write

name: PatchPro (Sprint-0)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: patchpro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patchpro:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch full history for proper git diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzers and PatchPro
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.5.7 semgrep==1.84.0
          pip install git+https://github.com/${{ github.repository_owner }}/patchpro-bot.git@agent-dev

      - name: Get changed files in PR
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Get changed Python files in the PR with full git history
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(py)$' | tr '\n' ' ' | xargs)
            echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "Changed Python files in PR: '$CHANGED_FILES'"
            echo "Number of changed Python files: $(echo $CHANGED_FILES | wc -w)"
          else
            # For workflow_dispatch, simulate PR by comparing with main branch
            echo "Simulating PR behavior - comparing with main branch"
            git fetch origin main || git fetch origin master || echo "No main/master branch found"
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.(py)$' | tr '\n' ' ' || \
                          git diff --name-only HEAD~5...HEAD | grep -E '\.(py)$' | tr '\n' ' ' || \
                          echo "ci_test.py example.py test_sample.py")
            echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "Simulated PR changed files: $CHANGED_FILES"
          fi

      - name: Run PatchPro integrated pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CHANGED_FILES="${{ steps.changed-files.outputs.changed_files }}"
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "Running PatchPro integrated pipeline on: $CHANGED_FILES"
            # Create a temporary directory with only changed files for focused analysis
            mkdir -p changed_files_only
            for file in $CHANGED_FILES; do
              if [ -f "$file" ]; then
                cp "$file" "changed_files_only/"
              fi
            done
            python -m patchpro_bot.cli run-ci --base-dir changed_files_only --artifacts artifact
          else
            echo "No changed files detected via git diff, running on current Python files for demo"
            # For demo purposes, let's analyze the current Python files
            echo "Analyzing current Python files: example.py, ci_test.py, test_sample.py"
            python -m patchpro_bot.cli run-ci --base-dir . --artifacts artifact --tools ruff semgrep
          fi

      - name: Set up git authentication for push
        if: github.event_name == 'pull_request'
        run: |
          git config --global user.name "patchpro-bot"
          git config --global user.email "patchpro-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push PatchPro autocorrected changes with error handling
        if: github.event_name == 'pull_request'
        run: |
          set -e
          # Only add source code files, not artifacts
          git add '*.py' '*.js' '*.ts' '*.java' '*.cpp' '*.c' '*.h' '*.css' '*.html' '*.md' || true
          # Explicitly exclude artifacts
          git reset HEAD artifact/ changed_files_only/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: PatchPro Bot autocorrect"
            git fetch origin ${{ github.head_ref }}
            # Try to rebase, auto-resolve conflicts in analysis artifacts  
            if ! git rebase origin/${{ github.head_ref }}; then
              echo "Rebase failed, attempting to resolve conflicts..."
              git rebase --continue || true
            fi
            # Try to push, if fails, print error and exit gracefully
            if ! git push origin HEAD:${{ github.head_ref }}; then
              echo "Push failed after rebase. Please resolve conflicts manually."
              exit 0
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchpro-artifacts
          path: artifact/

      - name: Ensure report exists
        run: |
          if [ ! -f artifact/report.md ]; then
            echo "No report generated." > artifact/report.md
          fi

      - name: Post summary comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: artifact/report.md
